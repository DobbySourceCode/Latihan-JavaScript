<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Second Stopwatch</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            flex-direction: column;
        }
        .stopwatch-container {
            text-align: center;
            border: 2px solid #ccc;
            padding: 30px;
            border-radius: 10px;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        #timeDisplay {
            font-size: 5rem; /* Ukuran angka lebih besar */
            font-weight: bold;
            margin-bottom: 20px;
        }
        .buttons button {
            font-size: 1.2rem;
            padding: 10px 20px;
            margin: 0 5px;
            cursor: pointer;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .buttons button:hover {
            background-color: #e9e9e9;
        }
    </style>
</head>
<body>

    <div class="stopwatch-container">
        <div id="timeDisplay">0</div>
        <div class="buttons">
            <button onclick="startTimer()">Start</button>
            <button onclick="stopTimer()">Stop</button>
            <button onclick="resetTimer()">Reset</button>
        </div>
    </div>

    <script>
        // Mengambil elemen display dari HTML
        const timeDisplay = document.getElementById('timeDisplay');

        // Variabel untuk menyimpan status stopwatch
        let startTime = 0;
        let elapsedTime = 0;
        let timerInterval;
        let isRunning = false;

        function startTimer() {
            // Hanya jalankan jika stopwatch tidak sedang berjalan
            if (!isRunning) {
                isRunning = true;
                // Waktu mulai dihitung dari waktu saat ini dikurangi waktu yang sudah berlalu
                // Ini penting untuk fitur pause/resume
                startTime = Date.now() - elapsedTime;
                // Perbarui tampilan setiap 100 milidetik untuk akurasi
                timerInterval = setInterval(updateTime, 100);
            }
        }

        function stopTimer() {
            // Hanya hentikan jika stopwatch sedang berjalan
            if (isRunning) {
                isRunning = false;
                // Menghentikan interval pembaruan waktu
                clearInterval(timerInterval);
            }
        }

        function resetTimer() {
            // Menghentikan interval jika sedang berjalan
            clearInterval(timerInterval);
            
            // Mereset semua variabel ke nilai awal
            isRunning = false;
            startTime = 0;
            elapsedTime = 0;
            
            // Mengembalikan tampilan ke 0
            timeDisplay.textContent = "0";
        }

        function updateTime() {
            // Menghitung total waktu yang telah berlalu dalam milidetik
            const currentTime = Date.now();
            elapsedTime = currentTime - startTime;
            
            // Mengonversi milidetik ke detik dan membulatkannya ke bawah
            let seconds = Math.floor(elapsedTime / 1000);
            
            // Memperbarui teks pada elemen display
            timeDisplay.textContent = seconds;
        }
    </script>

</body>
</html>
